databases:
  - name: smart-canteen-db
    databaseName: smart_canteen
    user: smart_canteen
    plan: basic-256mb

services:
  - type: web
    name: smart-canteen
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-canteen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
