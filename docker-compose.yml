services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_canteen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - canteen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_canteen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canteen-postgres:
